plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Google Services plugin — activates when google-services.json is present
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.kora.messenger"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.kora.messenger"
        minSdk = 21
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // ═══ APP BUNDLE SPLIT CONFIGURATIONS ═══
        // Enables per-density, per-language, and per-ABI splits so that
        // Google Play delivers only the resources each device needs.
        // This works with AAB (Android App Bundle) format.
        bundle {
            language {
                enableSplit = true
            }
            density {
                enableSplit = true
            }
            abi {
                enableSplit = true
            }
        }
    }

    // ABI splits handled by Flutter build flags (--target-platform)
    // Removed splits block for AGP 8.x compatibility

    // ═══ RELEASE SIGNING CONFIGURATION ═══
    // Loads keystore from key.properties (local dev) or environment vars (CI)
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("key.properties")
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    } else {
        // Fallback to environment variables (GitHub Actions CI)
        keystoreProperties.setProperty('keyAlias', System.getenv('KEY_ALIAS') ?: 'kora-key')
        keystoreProperties.setProperty('keyPassword', System.getenv('KEY_PASSWORD') ?: '')
        keystoreProperties.setProperty('storeFile', System.getenv('KEYSTORE_FILE') ?: 'keystore/kora-release-key.jks')
        keystoreProperties.setProperty('storePassword', System.getenv('KEYSTORE_PASSWORD') ?: '')
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release

            // ═══ CODE SHRINKING + RESOURCE SHRINKING (R8) ═══
            // R8 compiler: removes unused code, obfuscates, optimizes
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Enable R8 full mode for more aggressive optimization
            // (requires AGP 8.0+)
        }
        debug {
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    // Firebase Messaging — needed by native Kotlin KoraFcmService
    implementation "com.google.firebase:firebase-messaging:24.0.1"

    // ML Kit Translate — uses RemoteModelManager for on-demand downloads
    // NO bundled language models — downloaded only when user requests translation
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "com.google.mlkit:language-id:17.0.5"

    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}

flutter {
    source = "../.."
}
