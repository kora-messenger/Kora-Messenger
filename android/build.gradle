allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}
// Fix for plugins that don't specify a namespace (required by AGP 8+)
// Must be in a separate block to avoid afterEvaluate conflicts
subprojects {
    plugins.withId("com.android.library") {
        if (android.namespace == null || android.namespace.isEmpty()) {
            android.namespace = project.group.toString() + "." + project.name.toString().replace("-", "_").replace(":", "_")
        }
    }
    plugins.withId("com.android.application") {
        if (android.namespace == null || android.namespace.isEmpty()) {
            android.namespace = project.group.toString() + "." + project.name.toString().replace("-", "_").replace(":", "_")
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
