# fly.toml app configuration file generated for kora-messenger on 2026-08-29T22:07:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kora-messenger'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[processes]
  app = 'node src/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
