name: Sync Legal Docs to Pages Repo

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: kora-messenger/Kora-Messenger-Docs
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: docs-repo

      - name: Sync files
        run: |
          cp -f docs/*.html docs-repo/
          cp -f docs/*.md docs-repo/ 2>/dev/null || true
          cp -f docs/*.css docs-repo/ 2>/dev/null || true
          cp -f docs/*.js docs-repo/ 2>/dev/null || true
          cp -rf docs/assets docs-repo/ 2>/dev/null || true

      - name: Commit and push
        run: |
          cd docs-repo
          git config user.email "koramessengerofficial@gmail.com"
          git config user.name "Kora Messenger Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Auto-sync legal docs from Kora-Messenger@${{ github.sha }}

            Triggered by push to main that modified docs/"
            git push origin main
            echo "Docs synced successfully."
          fi
