name: Deploy Kora Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _pages_out
          # Marketing landing page at the root
          cp -r site/. _pages_out/
          # Web chat client under /app
          mkdir -p _pages_out/app
          cp -r web/. _pages_out/app/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_pages_out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
