name: Build Kora Messenger APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
      - 'render.yaml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Decode release keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.KORA_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KORA_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/kora-release-key.jks
            echo "Keystore decoded successfully to android/app/keystore/"
          else
            echo "WARNING: KORA_KEYSTORE_BASE64 secret not set. Falling back to debug signing."
          fi

      - name: Build per-ABI APKs
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi \
            --dart-define=KORA_BACKEND_URL=${{ secrets.KORA_BACKEND_URL }} \
            --dart-define=KORA_AUTH_URL=${{ secrets.KORA_AUTH_URL }} \
            --dart-define=KORA_CHAT_URL=${{ secrets.KORA_CHAT_URL }} \
            --dart-define=KORA_UPLOAD_URL=${{ secrets.KORA_UPLOAD_URL }} \
            --dart-define=KORA_SETTINGS_URL=${{ secrets.KORA_SETTINGS_URL }} \
            --dart-define=KORA_AI_AUTH_TOKEN=${{ secrets.KORA_AI_AUTH_TOKEN }}

      - name: Save per-ABI APKs
        run: |
          mkdir -p /tmp/apk_backups
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/apk_backups/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk /tmp/apk_backups/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk /tmp/apk_backups/

      - name: Build universal APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=KORA_BACKEND_URL=${{ secrets.KORA_BACKEND_URL }} \
            --dart-define=KORA_AUTH_URL=${{ secrets.KORA_AUTH_URL }} \
            --dart-define=KORA_CHAT_URL=${{ secrets.KORA_CHAT_URL }} \
            --dart-define=KORA_UPLOAD_URL=${{ secrets.KORA_UPLOAD_URL }} \
            --dart-define=KORA_SETTINGS_URL=${{ secrets.KORA_SETTINGS_URL }} \
            --dart-define=KORA_AI_AUTH_TOKEN=${{ secrets.KORA_AI_AUTH_TOKEN }}

      - name: Prepare all APK files
        run: |
          cp /tmp/apk_backups/*.apk build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Kora-Messenger-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Kora-Messenger-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Kora-Messenger-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Kora-Messenger-universal.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kora-messenger-apk
          path: |
            build/app/outputs/flutter-apk/Kora-Messenger-arm64-v8a.apk
            build/app/outputs/flutter-apk/Kora-Messenger-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Kora-Messenger-x86_64.apk
            build/app/outputs/flutter-apk/Kora-Messenger-universal.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish public download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Kora Messenger — Latest Build"
          body: |
            Automatically published on every push to main.

            **APK Variants:**
            - **Kora-Messenger-arm64-v8a.apk**: Modern 64-bit ARM devices (most phones).
            - **Kora-Messenger-armeabi-v7a.apk**: Older 32-bit ARM devices.
            - **Kora-Messenger-x86_64.apk**: x86 emulators and tablets.
          files: |
            build/app/outputs/flutter-apk/Kora-Messenger-arm64-v8a.apk
            build/app/outputs/flutter-apk/Kora-Messenger-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Kora-Messenger-x86_64.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
