name: Build Kora Messenger APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=KORA_BACKEND_URL=${{ secrets.KORA_BACKEND_URL }} \
            --dart-define=KORA_AI_AUTH_TOKEN=${{ secrets.KORA_AI_AUTH_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kora-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
