name: Build Kora Messenger APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Decode release keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.KORA_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KORA_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/kora-release-key.jks
            echo "Keystore decoded successfully to android/app/keystore/"
          else
            echo "WARNING: KORA_KEYSTORE_BASE64 secret not set. Falling back to debug signing."
          fi

      - name: Build universal APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=KORA_BACKEND_URL=${{ secrets.KORA_BACKEND_URL }} \
            --dart-define=KORA_AI_AUTH_TOKEN=${{ secrets.KORA_AI_AUTH_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kora-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish public download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Kora Messenger — Latest Build"
          body: |
            Automatically published on every push to main.

            **Kora-Messenger-universal.apk** — Works on ALL Android devices.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
