name: kora_messenger
description: Kora Messenger — a premium messaging app for seamless communication.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  file_picker: ^10.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  device_info_plus: ^10.1.0
  android_id: ^0.5.2+1
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  share_plus: ^10.0.1
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  permission_handler: ^12.0.0
  flutter_contacts: ^2.0.0
  audio_session: ^0.2.3
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^20.0.0
  mobile_scanner: ^7.0.0
  screen_brightness: ^1.0.1
  connectivity_plus: ^7.0.0
  flutter_sound: ^9.16.3
  just_audio: ^0.10.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_webrtc: ^1.0.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/kora_icon.png
    - assets/badges/official_badge.png
    - assets/badges/premium_badge.png
    - assets/images/kora_logo_lockup.png
    - assets/images/world_map_glow.png
    - assets/images/kora_support_avatar.png
    - assets/images/kora_ai_avatar.png
    - assets/icons/icon_default_circle.png
    - assets/icons/icon_aurora_circle.png
    - assets/icons/icon_gold_elite.png
    - assets/wallpapers/cosmic_swirl.jpg
    - assets/wallpapers/white_horse_snow.jpg
    - assets/wallpapers/palm_leaf.jpg
    - assets/wallpapers/moon_in_hand.jpg
    - assets/wallpapers/otters_umbrella.jpg
    - assets/wallpapers/forest_squirrels.jpg
    - assets/wallpapers/polished_pebbles.jpg
    - assets/wallpapers/blue_pink_waves.jpg
    - assets/wallpapers/terracotta_shapes.jpg
    - assets/wallpapers/rose_petals.jpg
    - assets/wallpapers/butterfly_flower.jpg
    - assets/wallpapers/pink_tulip.jpg
    - assets/wallpapers/red_dahlia.jpg
    - assets/wallpapers/rainbow_tulip_splash.jpg
    - assets/wallpapers/glowing_dress_woman.jpg
    - assets/wallpapers/autumn_leaves.jpg
    - assets/wallpapers/colorful_3d_balls.jpg
    - assets/wallpapers/black_z_gradient.jpg
    - assets/wallpapers/kora_default_doodle_milk.png
